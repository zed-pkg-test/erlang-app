name: beamscale-firecracker-runtime-proof

on:
  push:
    branches:
      - beamscale-firecracker-runtime-proof-20260925

permissions:
  contents: write

jobs:
  rust-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            beamscale-proof/runtime-host
            beamscale-proof/api-server
      - name: Normalize Rust formatting
        run: |
          cargo fmt --manifest-path beamscale-proof/runtime-host/Cargo.toml --all
          cargo fmt --manifest-path beamscale-proof/api-server/Cargo.toml --all
      - name: Commit normalized proof mirror
        run: |
          if ! git diff --quiet -- beamscale-proof; then
            git config user.name "beamscale-proof-bot"
            git config user.email "beamscale-proof-bot@users.noreply.github.com"
            git add beamscale-proof
            git commit -m "proof: normalize mirrored Rust"
            git push
          fi
      - name: Runtime host clippy
        run: cargo clippy --manifest-path beamscale-proof/runtime-host/Cargo.toml --all-targets -- -D warnings
      - name: Runtime host tests
        run: cargo test --manifest-path beamscale-proof/runtime-host/Cargo.toml --all-targets
      - name: Runtime host fmt
        run: cargo fmt --manifest-path beamscale-proof/runtime-host/Cargo.toml --all -- --check
      - name: API server clippy
        run: cargo clippy --manifest-path beamscale-proof/api-server/Cargo.toml --all-targets -- -D warnings
      - name: API server tests
        run: cargo test --manifest-path beamscale-proof/api-server/Cargo.toml --all-targets
      - name: API server fmt
        run: cargo fmt --manifest-path beamscale-proof/api-server/Cargo.toml --all -- --check
