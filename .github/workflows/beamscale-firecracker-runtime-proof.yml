name: beamscale-firecracker-runtime-proof

on:
  push:
    branches:
      - beamscale-firecracker-runtime-proof-20260925

permissions:
  contents: read

jobs:
  runtime-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: beamscale/bmscl-infra
          ref: feature/firecracker-runtime-cells
          path: beamscale-infra
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            beamscale-infra/modules/tenant_runtime/runtime-host
            beamscale-infra/modules/tenant_runtime/guest-agent
      - name: Runtime host clippy
        run: cargo clippy --manifest-path beamscale-infra/modules/tenant_runtime/runtime-host/Cargo.toml --all-targets -- -D warnings
      - name: Runtime host tests
        run: cargo test --manifest-path beamscale-infra/modules/tenant_runtime/runtime-host/Cargo.toml --all-targets
      - name: Runtime host fmt
        run: cargo fmt --manifest-path beamscale-infra/modules/tenant_runtime/runtime-host/Cargo.toml --all -- --check
      - name: Guest agent clippy
        run: cargo clippy --manifest-path beamscale-infra/modules/tenant_runtime/guest-agent/Cargo.toml --all-targets -- -D warnings
      - name: Guest agent tests
        run: cargo test --manifest-path beamscale-infra/modules/tenant_runtime/guest-agent/Cargo.toml --all-targets
      - name: Topology validation
        working-directory: beamscale-infra
        run: python3 scripts/validate-deployment-topology.py
